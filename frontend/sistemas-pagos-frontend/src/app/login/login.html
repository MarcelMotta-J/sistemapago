<div class="container">
    <!-- 
    A diretiva [formGroup] no Html vincula um formulário
     Html com um objeto de FormGroup, vide login.ts
      -->
    <mat-card class="login-form" [formGroup]="loginForm">
        <mat-card-header>
            <mat-card-title>Authentication</mat-card-title>
        </mat-card-header>

        <mat-divider></mat-divider>

        <mat-card-content>
            <mat-form-field appearance="outline">
                <mat-label>Username or Email</mat-label>
                <!-- a diretiva formControlName que se utiliza em um formulário reativo
                  para vincular um controle Html -->
                <input matInput formControlName="username" >
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Password</mat-label>
                <input matInput  formControlName="password" type="password" >
            </mat-form-field>
        </mat-card-content>

        <mat-card-actions class="align-end">
            <!-- método login() em src/app/login/login.ts -->
            <button (click)="login()" mat-raised-button >Login</button>
        </mat-card-actions>

    </mat-card>
</div>
