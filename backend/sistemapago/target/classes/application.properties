spring.application.name=sistemapago

# H2 é uma base de dados em memória
spring.datasource.url=jdbc:h2:mem:estudiantes-db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.h2.console.enabled=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# configuração JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# adicionar dependencia https://springdoc.org/
spring.mvc.format.date=dd/MM/yyyy

# configurando rota do swagger
# http://localhost:8080/swagger-ui/index.html
# ou
# http://localhost:8080/swagger-ui.html 
springdoc.swagger-ui.path=/swagger-ui.html


# tempo logado em minutos, sem m de minutos estar� em segundos
server.session.timeout=20m
